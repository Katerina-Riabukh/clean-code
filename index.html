<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="hero">
      <img class="hero-img" src="./eisenhower-matrix.jpg">
      <a class="more-info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main-container">
      <h3>Add Item</h3>
      <p class="new-task-wrapper">
        <!-- <label for="new-task">Add Item</label> -->
        <!-- <div class="new-task-wrapper"> -->
          <input class="text-area task new-task" id="new-task" type="text">
          <button>Add</button>
        <!-- </div> -->
      </p>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li class="task-item edit-mode">
          <input class="checkbox" type="checkbox">
          <label class="lable task">Pay Bills</label>
          <input class="text-area task" type="text" value="Pay Bills">
          <button class="edit">Edit</button>
          <button class="delete">
            <img class="delete-button-svg" src="./remove.svg">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input class="checkbox" type="checkbox">
          <label class="lable task">Go Shopping</label>
          <input class="text-area task" type="text" value="Go Shopping" >
          <button class="edit">Save</button>
          <button class="delete">
            <img class="delete-button-svg" src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li class="task-item">
          <input class="checkbox" type="checkbox" checked>
          <label class="lable task">See the Doctor</label>
          <input class="text-area task" type="text">
          <button class="edit">Edit</button>
          <button class="delete">
            <img class="delete-button-svg" src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
